<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toccopola Admin - Control Panel</title>

    <link
      id="theme-link"
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootswatch@5/dist/lux/bootstrap.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="menu-container shadow-lg p-4">
        <h1
          class="text-center fw-900 text-uppercase border-bottom border-4 border-dark pb-3 mb-5"
        >
          Admin Control Panel
        </h1>

        <div class="card border-dark mb-5">
          <div class="card-header bg-dark text-white">
            <h4 class="mb-0 text-uppercase fw-bold">Site Appearance</h4>
          </div>
          <div class="card-body">
            <div class="row align-items-end">
              <div class="col-md-8">
                <label class="form-label fw-bold small"
                  >SELECT BOOTSWATCH THEME</label
                >
                <select id="themeSelector" class="form-select border-dark">
                  <option value="lux">Lux (Modern / Sharp)</option>
                  <option value="slate">Slate (Dark / Heavy)</option>
                  <option value="solar">Solar (Aged / Premium)</option>
                  <option value="journal">Journal (Classic Paper)</option>
                  <option value="flatly">Flatly (Clean / Colorful)</option>
                </select>
              </div>
              <div class="col-md-4 mt-3">
                <button
                  onclick="saveTheme()"
                  class="btn btn-dark w-100 fw-bold"
                >
                  APPLY THEME
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="card border-dark">
          <div
            class="card-header bg-dark text-white d-flex justify-content-between align-items-center"
          >
            <h4 class="mb-0 text-uppercase fw-bold">Menu Manager</h4>
            <span class="badge bg-warning text-dark">MongoDB Live</span>
          </div>
          <div class="card-body">
            <form
              id="menu-form"
              class="row g-3 mb-5 p-3 bg-light border border-dark"
            >
              <div class="col-md-4">
                <input
                  type="text"
                  id="itemName"
                  class="form-control"
                  placeholder="Item Name (or leave blank for gap)"
                  required
                />
              </div>
              <div class="col-md-3">
                <input
                  type="text"
                  id="itemCategory"
                  class="form-control"
                  placeholder="Category"
                  required
                />
              </div>
              <div class="col-md-2">
                <input
                  type="number"
                  id="itemPrice"
                  class="form-control"
                  placeholder="Price (0 to hide)"
                  step="0.01"
                />
              </div>
              <div class="col-md-3">
                <button type="submit" class="btn btn-success w-100 fw-bold">
                  ADD ITEM
                </button>
              </div>
              <div class="col-12">
                <textarea
                  id="itemDescription"
                  class="form-control"
                  placeholder="Description (Optional)"
                ></textarea>
              </div>
            </form>

            <div class="table-responsive">
              <table class="table table-hover border border-dark">
                <thead class="table-dark">
                  <tr>
                    <th>Category</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="admin-menu-list"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let currentMenuItems = []; // Local copy of the full menu

      async function fetchAdminMenu() {
        const res = await fetch("/api/menu");
        currentMenuItems = await res.json();
        renderTable();
      }

      function renderTable() {
        const list = document.getElementById("admin-menu-list");
        list.innerHTML = currentMenuItems
          .map(
            (item, index) => `
            <tr>
                <td>${item.category}</td>
                <td>${item.name || "BLANK LINE"}</td>
                <td>$${(item.price || 0).toFixed(2)}</td>
                <td><button onclick="deleteItem(${index})" class="btn btn-danger btn-sm">DELETE</button></td>
            </tr>
        `,
          )
          .join("");
      }

      document
        .getElementById("menu-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const newItem = {
            name: document.getElementById("itemName").value,
            category: document.getElementById("itemCategory").value,
            price: parseFloat(document.getElementById("itemPrice").value) || 0,
            description: document.getElementById("itemDescription").value,
          };

          // Add to the local list
          currentMenuItems.push(newItem);

          // Save the ENTIRE list to the server
          await fetch("/api/menu", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(currentMenuItems),
          });

          document.getElementById("menu-form").reset();
          renderTable();
        });

      async function deleteItem(index) {
        currentMenuItems.splice(index, 1); // Remove from local list
        await fetch("/api/menu", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(currentMenuItems),
        });
        renderTable();
      }

      fetchAdminMenu();
    </script>
  </body>
</html>
