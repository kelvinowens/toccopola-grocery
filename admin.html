<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Toccopola Grocery</title>

    <!-- Bootswatch Theme -->
    <link
      id="themeStylesheet"
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootswatch@5/dist/lux/bootstrap.min.css"
    />

    <style>
      body {
        padding: 20px;
      }
      .card {
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🍽️ Admin Dashboard</h2>
        <select class="form-select w-auto" onchange="changeTheme(this.value)">
          <option value="lux">Lux</option>
          <option value="darkly">Darkly</option>
          <option value="cosmo">Cosmo</option>
          <option value="cyborg">Cyborg</option>
          <option value="minty">Minty</option>
        </select>
      </div>

      <!-- Form -->
      <div class="card mb-4">
        <div class="card-body">
          <h5>Add / Edit Menu Item</h5>
          <form id="menuForm">
            <input type="hidden" id="itemId" />
            <div class="row g-2">
              <div class="col-md-4">
                <input
                  type="text"
                  id="name"
                  class="form-control"
                  placeholder="Item Name"
                  required
                />
              </div>
              <div class="col-md-2">
                <input
                  type="number"
                  id="price"
                  class="form-control"
                  placeholder="Price"
                  required
                />
              </div>
              <div class="col-md-3">
                <input
                  type="text"
                  id="category"
                  class="form-control"
                  placeholder="Category"
                />
              </div>
              <div class="col-md-3">
                <input
                  type="text"
                  id="description"
                  class="form-control"
                  placeholder="Description"
                />
              </div>
            </div>
            <button class="btn btn-primary mt-3">Save Item</button>
          </form>
        </div>
      </div>

      <!-- Table -->
      <div class="card">
        <div class="card-body">
          <h5>Menu Items</h5>
          <table class="table table-striped">
            <thead>
              <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Category</th>
                <th>Description</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="menuTable"></tbody>
          </table>
        </div>
      </div>

      <button class="btn btn-success mt-3" onclick="downloadJSON()">
        💾 Download JSON
      </button>
    </div>

    <script>
      let menu = [];

      // Load existing menu.json
      fetch("data/menu.json")
        .then((res) => res.json())
        .then((data) => {
          menu = data;
          renderTable();
        })
        .catch(() => {
          menu = [];
        });

      function renderTable() {
        const table = document.getElementById("menuTable");
        table.innerHTML = "";

        menu.forEach((item) => {
          table.innerHTML += `
      <tr>
        <td>${item.name}</td>
        <td>$${item.price}</td>
        <td>${item.category || ""}</td>
        <td>${item.description || ""}</td>
        <td>
          <button class="btn btn-sm btn-warning" onclick='editItem(${JSON.stringify(item)})'>Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deleteItem(${item.id})">Delete</button>
        </td>
      </tr>
    `;
        });
      }

      // Add / Update Item
      document
        .getElementById("menuForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const id = document.getElementById("itemId").value;

          const item = {
            id: id ? Number(id) : Date.now(),
            name: document.getElementById("name").value,
            price: parseFloat(document.getElementById("price").value),
            category: document.getElementById("category").value,
            description: document.getElementById("description").value,
          };

          if (id) {
            menu = menu.map((m) => (m.id == id ? item : m));
          } else {
            menu.push(item);
          }

          this.reset();
          document.getElementById("itemId").value = "";
          renderTable();
        });

      function editItem(item) {
        document.getElementById("itemId").value = item.id;
        document.getElementById("name").value = item.name;
        document.getElementById("price").value = item.price;
        document.getElementById("category").value = item.category;
        document.getElementById("description").value = item.description;
      }

      function deleteItem(id) {
        if (confirm("Delete this item?")) {
          menu = menu.filter((item) => item.id !== id);
          renderTable();
        }
      }

      function downloadJSON() {
        const blob = new Blob([JSON.stringify(menu, null, 2)], {
          type: "application/json",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "menu.json";
        a.click();
      }

      function changeTheme(theme) {
        document.getElementById("themeStylesheet").href =
          `https://cdn.jsdelivr.net/npm/bootswatch@5/dist/${theme}/bootstrap.min.css`;
        localStorage.setItem("theme", theme);
      }

      // Load saved theme
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme) changeTheme(savedTheme);
    </script>
  </body>
</html>
